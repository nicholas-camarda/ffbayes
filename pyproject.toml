[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ffbayes"
version = "0.1.0"
description = "Reproducible fantasy-football draft board"
requires-python = ">=3.10"
authors = [{ name = "Nicholas Camarda" }]
readme = "README.md"
keywords = ["fantasy-football", "draft-board"]
license = { text = "MIT" }
dependencies = [
  "nflreadpy>=0.1.5",
  "numpy>=1.20",
  "pandas>=1.5",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.5"]

[project.scripts]
ffbayes = "ffbayes.cli:main"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle
  "F",  # pyflakes
  "I",  # isort
]
ignore = [
  "F841",  # no unused variable
  "E501",  # line length handled by formatter
]

[tool.ruff]
[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
no_implicit_optional = false
check_untyped_defs = false
warn_unused_ignores = true
disable_error_code = ["import-untyped"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ffbayes*"]
