name: Test Suite

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Python checks and dashboard smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js for browser smoke tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install browser smoke dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Python package and development tools
        run: python -m pip install -e '.[dev]'

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run Ruff
        run: ruff check tests src

      - name: Run mypy
        run: mypy src

      - name: Run canonical fixture browser smoke
        env:
          PYTHON: python
        run: node tests/test_draft_2026_dashboard_browser.mjs

      - name: Run root dashboard smoke contract
        env:
          PYTHON: python
        run: npm test
